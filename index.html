<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff3f8">
  <title>沙永鑫模考奖励</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #fff8fb, #f8edf3);
      color: #503943;
    }
    body { display: flex; justify-content: center; }
    .page {
      width: min(100%, 560px);
      min-height: 100vh;
      padding: 24px 16px 36px;
    }
    .hero {
      text-align: center;
      padding: 34px 18px 28px;
      background: rgba(255,255,255,.9);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(137,72,104,.15);
    }
    .gift {
      width: 84px;
      height: 84px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: linear-gradient(145deg, #ffd5e6, #fff);
      font-size: 42px;
    }
    h1 { margin: 0; font-size: 27px; }
    .subtitle {
      margin: 10px 0 0;
      color: #9d7e8c;
      font-size: 14px;
      line-height: 1.7;
    }
    #unlock { position: absolute; opacity: 0; pointer-events: none; }
    .unlock-btn {
      display: block;
      width: 100%;
      margin-top: 22px;
      border-radius: 999px;
      padding: 16px 20px;
      font-size: 17px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #ff78ad, #ef4f93);
      box-shadow: 0 12px 24px rgba(239,79,147,.28);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .reward {
      display: none;
      margin-top: 20px;
      animation: reveal .55s ease both;
    }
    #unlock:checked ~ .hero .unlock-btn {
      opacity: .75;
    }
    #unlock:checked ~ .hero .before { display: none; }
    #unlock:checked ~ .hero .after { display: inline; }
    #unlock:checked ~ .reward { display: block; }
    .after { display: none; }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .success {
      text-align: center;
      margin: 8px 0 18px;
      font-size: 18px;
      font-weight: 700;
      color: #ef4f93;
    }
    .gallery { display: grid; gap: 18px; }
    .card {
      background: rgba(255,255,255,.93);
      border-radius: 24px;
      padding: 10px;
      box-shadow: 0 12px 34px rgba(125,82,105,.14);
      overflow: hidden;
    }
    .card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
    }
    .caption {
      text-align: center;
      padding: 11px 4px 5px;
      font-size: 13px;
      color: #9d7e8c;
    }
    .footer {
      text-align: center;
      padding-top: 24px;
      color: #b391a1;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="page">
    <input type="checkbox" id="unlock">

    <section class="hero">
      <div class="gift">🎁</div>
      <h1>沙永鑫模考奖励</h1>
      <p class="subtitle">恭喜完成模考！<br>点击下方按钮领取专属奖励。</p>
      <label class="unlock-btn" for="unlock">
        <span class="before">领取奖励</span>
        <span class="after">奖励已领取 ✓</span>
      </label>
    </section>
